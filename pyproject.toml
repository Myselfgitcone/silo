[project]
name = "silo"
version = "0.1.0"
description = "An MCP server and AI analyst over the Grainflow lakehouse."
readme = "README.md"
authors = [{ name = "Jagadish Butukuri", email = "jagadishbutukuri11@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13",
    "sqlglot>=26",
    "typer>=0.12",
]

[project.scripts]
silo = "silo.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silo"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
