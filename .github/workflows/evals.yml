name: evals

# Real questions to the real model, graded against the live lake. Runs when
# something that shapes answers changes, weekly to catch data drift, and on
# demand. Costs about two cents a run.
on:
  pull_request:
    paths:
      - "src/silo/agent.py"
      - "src/silo/server.py"
      - "src/silo/semantic.py"
      - "src/silo/metrics.yml"
      - "src/silo/tools.py"
      - "src/silo/guard.py"
      - "evals/**"
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SILO_DAILY_BUDGET_USD: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Run evals
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set; skipping evals." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run silo eval --min-pass 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: .silo/evals/
          if-no-files-found: ignore
